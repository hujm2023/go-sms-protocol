name: Fuzz

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./packet
            target: FuzzPacketReader
          - package: ./datacoding
            target: FuzzGSM7PackedDecodeEncodeStability
          - package: ./datacoding
            target: FuzzGSM7UnpackedRoundTrip
          - package: ./datacoding
            target: FuzzUCS2EncodeDecodeStability
          - package: ./datacoding
            target: FuzzGB18030EncodeDecodeStability
          - package: ./cmpp/cmpp20
            target: FuzzDecodeCMPP20Dispatcher
          - package: ./cmpp/cmpp30
            target: FuzzDecodeCMPP30Dispatcher
          - package: ./sgip/sgip12
            target: FuzzDecodeSGIP12
          - package: ./smgp
            target: FuzzParseOptions
          - package: ./smgp/smgp30
            target: FuzzDecodeSMGP30
          - package: ./smpp/smpp34
            target: FuzzDecodeSMPP34RoundTrip
          - package: ./smpp/smpp34
            target: FuzzDeliveryReceiptRoundTrip

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Run bounded fuzz smoke
        run: go test "${{ matrix.package }}" -fuzz="${{ matrix.target }}" -fuzztime=30s
